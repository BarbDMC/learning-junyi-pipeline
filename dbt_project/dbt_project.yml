name: 'junyi_analytics'
version: '1.0.0'
config-version: 2

profile: 'junyi_warehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  junyi_analytics:
    # Layer 1: Cleaning, typing and standardization (views)
    staging:
      +materialized: view
      +schema: staging
    # Layer 2: Fact and dimension tables (physical tables)
    marts:
      +materialized: table
      +schema: marts
